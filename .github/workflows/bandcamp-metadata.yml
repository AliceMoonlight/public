name: Resolve Bandcamp players
on:
  push:
    paths:
      - '.github/workflows/bandcamp-metadata.yml'
      - 'scripts/resolve_bandcamp.py'
      - 'candidates.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi beautifulsoup4
      - name: Resolve Bandcamp track IDs and lyrics presence
        run: python scripts/resolve_bandcamp.py
      - name: Commit verified embed IDs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player_manifest.json
          git diff --cached --quiet || (git commit -m 'Update verified Bandcamp player manifest' && git push)